name: Speech Hearing Daily Intelligence

on:
  schedule:
    - cron: "30 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  intelligence:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------
      # CHECKOUT
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------
      # PYTHON
      # --------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------
      # DEPENDENCIES
      # --------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install beautifulsoup4
          pip install python-dateutil
          pip install pyyaml


      # --------------------------------
      # DIRECTORIES
      # --------------------------------

      - name: Create required directories
        run: |
          mkdir -p data
          mkdir -p audit


      # --------------------------------
      # RUN INTELLIGENCE
      # --------------------------------

      - name: Run ISHA Professional Intelligence V7.2.0
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python scripts/speech_hearing_alerts_v7_2_0.py


      # --------------------------------
      # SAVE MEMORY / AUDIT
      # --------------------------------

      - name: Save alert memory and audit
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ audit/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update professional intelligence"
            git push
          fi
